name: Check plugin

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - run: npm install
      - name: Build the ramu CLI
        run: |
          git clone --depth 1 https://github.com/akalstack/ramu.git "$RUNNER_TEMP/ramu"
          cd "$RUNNER_TEMP/ramu"
          pnpm install --frozen-lockfile --filter @ramu/server...
          pnpm --filter @ramu/server build
      - run: node "$RUNNER_TEMP/ramu/apps/server/dist/cli.js" plugin check .
